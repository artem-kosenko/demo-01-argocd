apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 5.12.0
    helm:
      values: |
        controller:
          service:
            type: NodePort # for local access
            nodePorts:
              http: 30080
              https: 30443
            externalTrafficPolicy: Local
