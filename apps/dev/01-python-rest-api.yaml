apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-rest-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/artem-kosenko/demo-github-actions.git
    targetRevision: develop
    path: templates/python-rest-api/charts/python-rest-api
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
